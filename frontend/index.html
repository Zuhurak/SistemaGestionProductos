<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestion de Productos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Sistema de Gestion de Productos</h1>
        <p>Administracion de productos e inventario</p>
    </header>

    <main>

        <!-- Formulario -->
        <section class="formulario">

            <h2 id="tituloFormulario">Registrar producto</h2>

            <form id="productForm">

                <input type="hidden" id="productoId">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Nombre del producto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descripcion">Descripcion</label>
                    <textarea
                        id="descripcion"
                        placeholder="Descripcion del producto"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input
                        type="number"
                        id="precio"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input
                        type="text"
                        id="categoria"
                        placeholder="Categoria"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="stock">Stock</label>
                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        placeholder="0"
                        required
                    >
                </div>

                <div class="botones">

                    <button type="submit" id="btnGuardar">
                        Guardar producto
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="cancelar"
                        style="display: none;"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

            <div id="mensaje"></div>

        </section>


        <!-- Lista de productos -->
        <section class="lista">

            <div class="encabezadoLista">

                <h2>Productos registrados</h2>

                <div class="busqueda">

                    <input
                        type="text"
                        id="buscar"
                        placeholder="Buscar producto..."
                    >

                    <button id="btnBuscar">
                        Buscar
                    </button>

                    <button id="btnMostrarTodos">
                        Mostrar todos
                    </button>

                </div>

            </div>


            <div class="tabla-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Precio</th>
                            <th>Categoria</th>
                            <th>Stock</th>
                            <th>Disponible</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProductos">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
